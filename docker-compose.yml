version: '3.8'

services:
  scanner:
    build: .
    container_name: openspy-scanner
    ports:
      - "8000:8000"
    environment:
      - OPENSPY_KEY=${OPENSPY_KEY}
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - openspy
    # Optional: resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

networks:
  openspy:
    driver: bridge
